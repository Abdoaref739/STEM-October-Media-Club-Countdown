<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM October Media Club Countdown | Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!--website top-->
    <div class="circle" id="circle1">
        <div id="clock-line"></div>
    </div>
    <div class="circle" id="circle2">
    </div>
    <div class="main-text-div">
    <span>Count down to the</span>
     <h1 class="main-text">STEM October <span>Media Club</span></h1>
     <span>official launch</span>
    </div>
    <!--countdown section-->
    <div id="countdown-div">
        <div class="countdown-box">
            <h1 id="days-countdown"></h1>
            <span>days</span>
        </div>
        <div class="countdown-box">
            <h1 id="hours-countdown"></h1>
            <span>Hours</span>
        </div>
        <div class="countdown-box">
            <h1 id="minutes-countdown"></h1>
            <span>Minutes</span>
        </div>
        <div class="countdown-box">
            <h1 id="seconds-countdown"></h1>
            <span>Seconds</span>
        </div>
    </div>
    <button id="rsvp-btn">RSVP here!</button>
    <h1 class="socialmedia-title">Reach us out!</h1>
    <div class="socialmedia-section">
        <i class="fa-brands fa-square-instagram" id="icon"></i>
        <i class="fa-brands fa-linkedin" id="icon"></i>
        <i class="fa-brands fa-square-whatsapp" id="icon"></i>
        <i class="fa-brands fa-square-facebook" id="icon"></i>
        <i class="fa-solid fa-at" id="icon"></i>
    </div>
    <footer>Made with 𑣲⋆ by <a href="https://github.com/abdoaref739">AbdEl-Rahman Aref</a> 2026 &copy;copyright All Rights Reserved</footer>
    <script src="script.js"></script>
</body>
</html>
